# Fly.io 배포 설정 — 내 주식 대시보드
app = "myboard"
primary_region = "nrt"   # 도쿄 (한국에서 가장 가까운 리전)

[build]

[env]
  PORT = "8080"
  FLY  = "true"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false   # 슬립 없음
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1

[[mounts]]
  source      = "stock_data"   # fly volume 이름
  destination = "/data"
  initial_size = 1             # GB
